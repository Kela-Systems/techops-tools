syntax = "proto3";

package kela.video_analytics.v1alpha1;

// Service for managing video analytics configurations.
// Configurations define which analytics pipelines run on which entity/sensor streams.
service VideoAnalyticsConfigService {
  // Set or update analytics configuration for a specific stream
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);

  // Get analytics configuration for a specific stream
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);

  // Delete analytics configuration for a specific stream
  rpc DeleteConfig(DeleteConfigRequest) returns (DeleteConfigResponse);

  // List all analytics configurations
  rpc ListConfigs(ListConfigsRequest) returns (ListConfigsResponse);

  // Watch for configuration changes (returns initial state then updates)
  rpc WatchConfigs(WatchConfigsRequest) returns (stream WatchConfigsResponse);

  // List the detection models the backend can serve, discovered from the model
  // repository. Lets clients render a live list instead of a hardcoded one.
  rpc ListAvailableModels(ListAvailableModelsRequest) returns (ListAvailableModelsResponse);

  // Register (or update) registry metadata for a model. Called after a model's
  // artifacts are published to the model repository, to attach provenance +
  // display metadata that the repository directory name alone can't carry.
  rpc RegisterModel(RegisterModelRequest) returns (RegisterModelResponse);
}

// How to treat detections that arrive while the source camera is in motion
// (inferred from frames when detect_camera_motion_from_video is enabled).
enum MotionDetectionsStrategy {
  // Unset on the wire — video-analytics treats it as NORMAL.
  MOTION_DETECTIONS_STRATEGY_UNSPECIFIED = 0;
  // Emit detections normally.
  MOTION_DETECTIONS_STRATEGY_NORMAL = 1;
  // Drop detections while moving. Suppresses RawTracks only; video-layer
  // bounding boxes are unaffected.
  MOTION_DETECTIONS_STRATEGY_SUPPRESS = 2;
  // Emit with elevated uncertainty while moving.
  MOTION_DETECTIONS_STRATEGY_UNCERTAINTY = 3;
}

// Analytics configuration for a specific entity/sensor stream.
message AnalyticsSchedule {
  // Whether scheduling is enabled for this config. When disabled, the model runs continuously (subject to config enabled).
  bool enabled = 1;

  // Wall-clock minutes from midnight (0-1439) in the schedule's timezone.
  // If start_minutes < end_minutes: active in [start, end)
  // If start_minutes > end_minutes: active overnight (e.g. 18:00 -> 06:00)
  uint32 start_minutes = 2;
  uint32 end_minutes = 3;

  // IANA timezone name (e.g. "Asia/Jerusalem") used to interpret start_minutes
  // and end_minutes as wall-clock time. Captured at the operator station when
  // the schedule is saved. Empty string is treated as UTC by the evaluator.
  string timezone = 4;
}

message AnalyticsConfig {
  // Unique identifier (UUID), generated by the hub on creation
  string id = 1;

  // Entity ID that owns the sensor
  string entity_id = 2;

  // Sensor ID within the entity
  string sensor_id = 3;

  // Stream index within the sensor (sensors can have multiple streams)
  // Defaults to 0 if not specified
  int32 stream_index = 4;

  // Human-readable name for this config (optional, not required to be unique)
  optional string name = 5;

  // Model identifier (e.g., "rfdetr_large_1024", "rfdetr-704-sfv4") — the model
  // repository directory / Triton model name. Empty means "use the backend's
  // default detection model", which tracks the deployment's bundled default
  // across releases; a non-empty value is a deliberate per-config pin (e.g. a
  // model under evaluation). Unset is the ONLY way to choose the default:
  // SetConfig rejects the declared default by name, so it can never freeze as a
  // stale pin when a release ships a new default.
  string model = 6;

  // Labels to detect (e.g., ["person", "car", "truck"])
  repeated string target_labels = 7;

  // Confidence threshold for detections (0.0 to 1.0)
  float conf_threshold = 8;

  // Enable object tracking across frames
  bool enable_tracking = 9;

  // Enable/disable running this config. If unset, defaults to enabled.
  optional bool enabled = 10;

  // Optional schedule for when this config should run.
  optional AnalyticsSchedule schedule = 11;

  // How to treat detections while the source camera is in motion. UNSPECIFIED
  // (proto3 zero default) is treated as NORMAL by video-analytics.
  MotionDetectionsStrategy motion_detections_strategy = 13;

  // When true, video-analytics runs a frame-based motion estimator on the
  // decoded stream. Unset is treated as true.
  optional bool detect_camera_motion_from_video = 14;

  // When true, the BoT-SORT tracker fuses appearance ReID (OSNet on Triton)
  // into association. Unset is treated as true, so ReID is on wherever the
  // model is available; video-analytics forces it off when OSNet isn't served
  // on Triton, regardless of this flag.
  optional bool enable_reid = 15;
}

message SetConfigRequest {
  AnalyticsConfig config = 1;
}

message SetConfigResponse {
  // The ID of the created/updated config
  string id = 1;
}

message GetConfigRequest {
  // The config ID (UUID)
  string id = 1;
}

message GetConfigResponse {
  AnalyticsConfig config = 1;
}

message DeleteConfigRequest {
  // The config ID (UUID)
  string id = 1;
}

message DeleteConfigResponse {}

message ListConfigsRequest {
  // Optional: filter by entity ID
  optional string entity_id = 1;
}

message ListConfigsResponse {
  repeated AnalyticsConfig configs = 1;
}

message WatchConfigsRequest {}

message WatchConfigsResponse {
  // Configurations that were added or updated
  repeated AnalyticsConfig updated = 1;

  // IDs of configurations that were deleted
  repeated string deleted_ids = 2;
}

message ListAvailableModelsRequest {}

// Serving state of a model in the inference repository (from Triton's index).
enum ModelState {
  MODEL_STATE_UNSPECIFIED = 0;
  MODEL_STATE_READY = 1;
  MODEL_STATE_UNAVAILABLE = 2;
  MODEL_STATE_LOADING = 3;
  MODEL_STATE_UNLOADING = 4;
}

// Fixed model input size in pixels. Absent when the model takes a dynamic size.
message ModelInputSize {
  int32 width = 1;
  int32 height = 2;
}

// A detection model in the inference repository, with its serving state and
// registry metadata. Entries may be UNAVAILABLE (e.g. an incompatible engine),
// so this is info about a repository model, not necessarily a serveable one.
message ModelInfo {
  // Identifier used as AnalyticsConfig.model (the model-repository directory name
  // = the Triton model name).
  string name = 1;

  // Human-readable label for display; clients fall back to name when unset.
  optional string display_name = 2;

  // Class labels the model detects, when known (empty otherwise). A dense
  // display/selection set, not a class-id map. Sourced from the model's Triton
  // config (`kela_labels`) when present; a registry row's labels are the
  // fallback only.
  repeated string labels = 3;

  // Vendor / owner from the registry; empty when the model isn't registered.
  string vendor = 4;

  // Fixed input size when the model declares one; unset if the model is dynamic.
  ModelInputSize input_size = 5;

  // Triton serving state from the repository index.
  ModelState state = 6;

  // When not READY, Triton's reason (e.g. an incompatible engine). Empty otherwise.
  string reason = 7;

  // Author from the model's config.pbtxt `author` parameter; "kela" when unset.
  string author = 8;
}

message ListAvailableModelsResponse {
  repeated ModelInfo models = 1;

  // The model an AnalyticsConfig with an empty `model` runs — the deployment's
  // default detector. Empty when the backend doesn't declare one (e.g. local
  // dev); clients then label the unset choice "Default" without naming it.
  string default_model = 2;
}

message RegisterModelRequest {
  // Model name = the model-repository directory / Triton model name. Required.
  string name = 1;

  // Optional display + provenance metadata.
  optional string display_name = 2;
  string vendor = 3;

  // Opaque provenance/auth token supplied by the uploader.
  string registration_key = 4;

  // Class labels the model detects, in class-id order (empty strings for gap
  // ids are allowed). Fallback only: when the served model's Triton config
  // carries `kela_labels`, those win in ListAvailableModels.
  repeated string labels = 5;

  // Fixed input size, when known (unset if the model is dynamic).
  ModelInputSize input_size = 6;
}

message RegisterModelResponse {
  // The stored registry record.
  ModelInfo model = 1;
}
