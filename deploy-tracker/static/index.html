<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deploy Tracker</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232733;
    --border: #2e3345;
    --text: #e1e4ed;
    --text-dim: #8b90a0;
    --accent: #6c8cff;
    --accent-hover: #8ba3ff;
    --green: #34d399;
    --green-bg: rgba(52,211,153,.12);
    --yellow: #fbbf24;
    --yellow-bg: rgba(251,191,36,.12);
    --red: #f87171;
    --red-bg: rgba(248,113,113,.10);
    --skip-color: #a78bfa;
    --skip-bg: rgba(167,139,250,.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    font-size: .85rem;
    font-weight: 500;
    padding: 6px 14px;
    transition: background .15s, opacity .15s;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-green { background: var(--green); color: #000; }
  .btn-green:hover:not(:disabled) { background: #4ade80; }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .btn-outline:hover:not(:disabled) { border-color: var(--text-dim); color: var(--text); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover:not(:disabled) { background: #fca5a5; }
  .btn-skip { background: var(--skip-bg); color: var(--skip-color); border: 1px solid rgba(167,139,250,.25); }
  .btn-skip:hover:not(:disabled) { background: rgba(167,139,250,.2); }
  .btn-break { background: var(--yellow-bg); color: var(--yellow); border: 1px solid rgba(251,191,36,.25); }
  .btn-break:hover:not(:disabled) { background: rgba(251,191,36,.2); }
  input, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: .9rem;
    outline: none;
    width: 100%;
  }
  input:focus, select:focus { border-color: var(--accent); }

  /* Layout */
  .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .view { display: none; }
  .view.active { display: block; }

  /* Setup */
  .setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    max-width: 440px;
    margin: 80px auto;
  }
  .setup-card h1 { font-size: 1.5rem; margin-bottom: 24px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: .8rem; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
  .setup-card button { width: 100%; margin-top: 8px; padding: 10px; font-size: 1rem; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row input { width: auto; }
  .checkbox-row label { margin: 0; text-transform: none; font-size: .85rem; color: var(--text); }

  /* Top bar */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .topbar h2 { font-size: 1.1rem; font-weight: 600; }
  .topbar .version { color: var(--text-dim); font-size: .85rem; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }

  /* Metrics strip */
  .metrics {
    display: flex;
    gap: 2px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0;
    overflow-x: auto;
  }
  .metric-item {
    flex: 1;
    text-align: center;
    padding: 10px 8px;
    min-width: 100px;
  }
  .metric-item .label { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
  .metric-item .value { font-size: 1.1rem; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* Device groups */
  .devices { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
  .device-group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .device-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .device-header h3 { font-size: .95rem; font-weight: 600; }
  .device-header .badge {
    font-size: .75rem;
    padding: 2px 8px;
    border-radius: 99px;
    background: rgba(108,140,255,.12);
    color: var(--accent);
  }

  /* Step rows */
  .step-row {
    display: grid;
    grid-template-columns: 32px 1fr 80px 80px 120px;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  .step-row:last-child { border-bottom: none; }
  .step-row:hover { background: rgba(255,255,255,.02); }
  .step-num { font-size: .8rem; color: var(--text-dim); text-align: center; font-variant-numeric: tabular-nums; }
  .step-name { font-size: .9rem; }
  .step-name .note { font-size: .78rem; color: var(--text-dim); margin-top: 1px; }
  .step-expected { font-size: .82rem; color: var(--text-dim); text-align: right; font-variant-numeric: tabular-nums; }
  .step-timer { font-size: .9rem; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; min-width: 80px; }
  .step-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .step-actions button { padding: 4px 10px; font-size: .78rem; }

  /* Status badges */
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-pending .status-dot { background: var(--text-dim); }
  .status-in_progress .status-dot { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .status-completed .status-dot { background: var(--green); }
  .status-skipped .status-dot { background: var(--skip-color); }
  .status-in_progress .step-timer { color: var(--yellow); }
  .status-completed .step-timer { color: var(--text-dim); }
  .status-skipped .step-name { color: var(--text-dim); text-decoration: line-through; }

  /* Break bar */
  .break-bar {
    background: var(--yellow-bg);
    border: 1px solid rgba(251,191,36,.2);
    color: var(--yellow);
    text-align: center;
    padding: 8px;
    font-size: .85rem;
    font-weight: 500;
  }

  /* Summary */
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 700px;
    margin: 40px auto;
    overflow: hidden;
  }
  .summary-card .header {
    padding: 24px;
    border-bottom: 1px solid var(--border);
    text-align: center;
  }
  .summary-card .header h2 { font-size: 1.3rem; margin-bottom: 4px; }
  .summary-card .header .sub { color: var(--text-dim); font-size: .85rem; }
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
  }
  .summary-cell {
    background: var(--surface);
    padding: 14px 20px;
  }
  .summary-cell .label { font-size: .75rem; text-transform: uppercase; color: var(--text-dim); letter-spacing: .05em; }
  .summary-cell .value { font-size: 1.1rem; font-weight: 600; margin-top: 2px; }
  .summary-section {
    padding: 20px 24px;
    border-top: 1px solid var(--border);
  }
  .summary-section h3 { font-size: .9rem; margin-bottom: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
  .summary-section li { padding: 3px 0; font-size: .88rem; }
  .summary-actions { padding: 20px 24px; display: flex; gap: 10px; justify-content: center; }
  .summary-actions button { padding: 10px 24px; font-size: .95rem; }
  .gsheet-link { color: var(--accent); text-decoration: none; font-size: .88rem; }
  .gsheet-link:hover { text-decoration: underline; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 360px;
  }
  .modal h3 { margin-bottom: 12px; font-size: 1rem; }
  .modal input { margin-bottom: 12px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>

<!-- ── Setup View ─────────────────────────────────────────── -->
<div id="view-setup" class="view active">
  <div class="setup-card">
    <h1>Deploy Tracker</h1>
    <div class="form-group">
      <label>Deployment Manifest</label>
      <select id="manifest-select"><option value="">Loading…</option></select>
    </div>
    <div class="form-group">
      <label>Deployer Name</label>
      <input type="text" id="deployer-input" placeholder="e.g. Avi S." />
    </div>
    <div class="form-group">
      <div class="checkbox-row">
        <input type="checkbox" id="dryrun-check" />
        <label for="dryrun-check">Dry run (skip Google Sheets upload)</label>
      </div>
    </div>
    <button class="btn-primary" id="start-btn" disabled>Start Deployment</button>
  </div>
</div>

<!-- ── Tracking View ──────────────────────────────────────── -->
<div id="view-track" class="view">
  <div class="topbar">
    <div class="topbar-left">
      <h2 id="deploy-name">—</h2>
      <span class="version" id="deploy-version"></span>
    </div>
    <div class="topbar-right">
      <button class="btn-break" id="break-btn">Start Break</button>
      <button class="btn-danger" id="finish-btn">Finish Deployment</button>
    </div>
  </div>
  <div id="break-bar" class="break-bar" style="display:none">On Break — <span id="break-timer">0:00</span></div>
  <div class="metrics" id="metrics-strip">
    <div class="metric-item"><div class="label">Wall Clock</div><div class="value" id="m-wall">—</div></div>
    <div class="metric-item"><div class="label">Active</div><div class="value" id="m-active">—</div></div>
    <div class="metric-item"><div class="label">Steps Total</div><div class="value" id="m-steps">—</div></div>
    <div class="metric-item"><div class="label">Expected</div><div class="value" id="m-expected">—</div></div>
    <div class="metric-item"><div class="label">Break</div><div class="value" id="m-break">—</div></div>
    <div class="metric-item"><div class="label">Overlap</div><div class="value" id="m-overlap">—</div></div>
    <div class="metric-item"><div class="label">Completion</div><div class="value" id="m-completion">—</div></div>
  </div>
  <div class="devices" id="devices-container"></div>
</div>

<!-- ── Summary View ───────────────────────────────────────── -->
<div id="view-summary" class="view">
  <div class="summary-card" id="summary-content"></div>
</div>

<!-- ── Note Modal ─────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">Note</h3>
    <input type="text" id="modal-input" placeholder="Optional note…" />
    <div class="modal-actions">
      <button class="btn-outline" id="modal-cancel">Cancel</button>
      <button class="btn-primary" id="modal-confirm">Confirm</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const api = (path, opts) => fetch(path, opts).then(r => r.json());
const postJson = (path, body = {}) => api(path, {
  method: 'POST',
  headers: {'Content-Type': 'application/json'},
  body: JSON.stringify(body),
});

let ws = null;
let currentState = null;
let modalResolve = null;

// ── Formatting ───────────────────────────────────────────

function fmtSeconds(sec) {
  if (sec == null || sec < 0) sec = 0;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function fmtMinutes(min) {
  if (min == null) return '—';
  min = Math.round(min * 10) / 10;
  if (min >= 60) {
    const h = Math.floor(min / 60);
    const m = Math.round(min % 60);
    return `${h}h ${String(m).padStart(2,'0')}m`;
  }
  return `${min}m`;
}

// ── Modal ────────────────────────────────────────────────

function promptNote(title) {
  return new Promise(resolve => {
    $('modal-title').textContent = title;
    $('modal-input').value = '';
    $('modal-overlay').classList.add('open');
    $('modal-input').focus();
    modalResolve = resolve;
  });
}

$('modal-cancel').onclick = () => {
  $('modal-overlay').classList.remove('open');
  if (modalResolve) { modalResolve(null); modalResolve = null; }
};
$('modal-confirm').onclick = () => {
  const v = $('modal-input').value.trim();
  $('modal-overlay').classList.remove('open');
  if (modalResolve) { modalResolve(v); modalResolve = null; }
};
$('modal-input').onkeydown = e => {
  if (e.key === 'Enter') $('modal-confirm').click();
  if (e.key === 'Escape') $('modal-cancel').click();
};

// ── Setup View ───────────────────────────────────────────

async function loadManifests() {
  const data = await api('/api/manifests');
  const sel = $('manifest-select');
  sel.innerHTML = '<option value="">Select a manifest…</option>';
  data.manifests.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m.replace('.yaml', '');
    sel.appendChild(opt);
  });
  sel.onchange = () => { $('start-btn').disabled = !sel.value; };
}

$('start-btn').onclick = async () => {
  const manifest = $('manifest-select').value;
  const deployer = $('deployer-input').value.trim() || 'Unknown';
  const dry_run = $('dryrun-check').checked;
  $('start-btn').disabled = true;
  $('start-btn').textContent = 'Starting…';
  try {
    await postJson('/api/session/start', { manifest, deployer, dry_run });
    showView('track');
    connectWs();
  } catch (e) {
    alert('Failed to start session: ' + e.message);
  }
  $('start-btn').disabled = false;
  $('start-btn').textContent = 'Start Deployment';
};

// ── WebSocket ────────────────────────────────────────────

function connectWs() {
  if (ws) ws.close();
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/session`);
  ws.onmessage = e => {
    const state = JSON.parse(e.data);
    currentState = state;
    if (state.finished) {
      ws.close();
      return;
    }
    renderTracking(state);
  };
  ws.onclose = () => {};
}

// ── Tracking Render ──────────────────────────────────────

let devicesDom = {};

function renderTracking(s) {
  $('deploy-name').textContent = s.deployment_name;
  $('deploy-version').textContent = s.version ? `v${s.version}` : '';
  if (s.dry_run) $('deploy-version').textContent += ' (dry run)';

  // Metrics
  $('m-wall').textContent = fmtSeconds(s.wall_clock_seconds);
  $('m-active').textContent = fmtMinutes(s.active_minutes);
  $('m-steps').textContent = fmtMinutes(s.steps_total_minutes);
  $('m-expected').textContent = fmtMinutes(s.expected_total_minutes);
  $('m-break').textContent = fmtMinutes(s.break_minutes);
  $('m-overlap').textContent = fmtMinutes(s.overlap_minutes);
  $('m-completion').textContent = `${s.completed_count}/${s.total_steps}`;

  // Break
  const bb = $('break-bar');
  const bbtn = $('break-btn');
  if (s.on_break) {
    bb.style.display = '';
    $('break-timer').textContent = fmtSeconds(s.break_elapsed_seconds);
    bbtn.textContent = 'End Break';
  } else {
    bb.style.display = 'none';
    bbtn.textContent = 'Start Break';
  }

  // Devices + steps
  renderDevices(s);
}

function renderDevices(s) {
  const container = $('devices-container');
  const devKeys = Object.keys(s.devices);

  // Build DOM only once, then update in place
  if (Object.keys(devicesDom).length === 0) {
    container.innerHTML = '';
    devKeys.forEach(dk => {
      const dev = s.devices[dk];
      const group = document.createElement('div');
      group.className = 'device-group';
      group.dataset.key = dk;

      const completedCount = dev.steps.filter(st => st.status === 'completed').length;
      group.innerHTML = `
        <div class="device-header">
          <h3>${dev.name} <span style="color:var(--text-dim);font-weight:400;font-size:.82rem">(${dk})</span></h3>
          <span class="badge" data-badge="${dk}">${completedCount}/${dev.steps.length}</span>
        </div>`;

      dev.steps.forEach(st => {
        const row = document.createElement('div');
        row.className = `step-row status-${st.status}`;
        row.dataset.num = st.menu_num;
        row.innerHTML = buildStepHtml(st);
        group.appendChild(row);
      });

      container.appendChild(group);
      devicesDom[dk] = group;
    });
    bindStepActions();
  } else {
    devKeys.forEach(dk => {
      const dev = s.devices[dk];
      const group = devicesDom[dk];
      if (!group) return;
      const badge = group.querySelector(`[data-badge="${dk}"]`);
      if (badge) {
        const completedCount = dev.steps.filter(st => st.status === 'completed').length;
        badge.textContent = `${completedCount}/${dev.steps.length}`;
      }
      dev.steps.forEach(st => {
        const row = group.querySelector(`[data-num="${st.menu_num}"]`);
        if (!row) return;
        row.className = `step-row status-${st.status}`;
        row.innerHTML = buildStepHtml(st);
      });
    });
    bindStepActions();
  }
}

function buildStepHtml(st) {
  let timerText = '';
  if (st.status === 'in_progress') timerText = fmtSeconds(st.elapsed_seconds);
  else if (st.status === 'completed') timerText = fmtSeconds(st.elapsed_seconds);
  else if (st.status === 'skipped') timerText = 'SKIP';

  let actions = '';
  if (st.status === 'pending') {
    actions = `<button class="btn-green act-start" data-num="${st.menu_num}">Start</button>
               <button class="btn-skip act-skip" data-num="${st.menu_num}">Skip</button>`;
  } else if (st.status === 'in_progress') {
    actions = `<button class="btn-primary act-done" data-num="${st.menu_num}">Done</button>`;
  }

  const noteHtml = st.notes ? `<div class="note">${escHtml(st.notes)}</div>` : '';

  return `
    <span class="step-num">${st.menu_num}</span>
    <span class="step-name"><span class="status-dot"></span>${escHtml(st.name)}${noteHtml}</span>
    <span class="step-expected">${st.expected_minutes}m exp</span>
    <span class="step-timer">${timerText}</span>
    <span class="step-actions">${actions}</span>`;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function bindStepActions() {
  document.querySelectorAll('.act-start').forEach(btn => {
    btn.onclick = async () => {
      await postJson(`/api/session/step/${btn.dataset.num}/start`);
    };
  });
  document.querySelectorAll('.act-done').forEach(btn => {
    btn.onclick = async () => {
      const note = await promptNote('Complete step — add a note?');
      if (note === null) return;
      await postJson(`/api/session/step/${btn.dataset.num}/complete`, { note });
    };
  });
  document.querySelectorAll('.act-skip').forEach(btn => {
    btn.onclick = async () => {
      const note = await promptNote('Skip reason');
      if (note === null) return;
      await postJson(`/api/session/step/${btn.dataset.num}/skip`, { note });
    };
  });
}

// Break toggle
$('break-btn').onclick = async () => {
  if (currentState && currentState.on_break) {
    const note = await promptNote('Break note (optional)');
    if (note === null) return;
    await postJson('/api/session/break/toggle', { note });
  } else {
    await postJson('/api/session/break/toggle', {});
  }
};

// Finish
$('finish-btn').onclick = async () => {
  if (!confirm('Finish this deployment?')) return;
  $('finish-btn').disabled = true;
  $('finish-btn').textContent = 'Finishing…';
  try {
    const result = await postJson('/api/session/finish');
    showSummary(result);
  } catch (e) {
    alert('Error finishing: ' + e.message);
  }
  $('finish-btn').disabled = false;
  $('finish-btn').textContent = 'Finish Deployment';
};

// ── Summary View ─────────────────────────────────────────

function showSummary(result) {
  const r = result.report;
  const wallMin = r.wall_clock_minutes;
  const activeMin = r.active_wall_clock_minutes;
  const expected = r.expected_total_minutes;
  const delta = activeMin - expected;
  const deltaPct = expected > 0 ? ((delta / expected) * 100).toFixed(1) : 0;
  const deltaSign = delta >= 0 ? '+' : '';

  let breaksList = '';
  if (r.breaks && r.breaks.length) {
    breaksList = '<ul>' + r.breaks.map(b =>
      `<li>${fmtMinutes(b.duration_minutes)}${b.note ? ' — ' + escHtml(b.note) : ''}</li>`
    ).join('') + '</ul>';
  } else {
    breaksList = '<p style="color:var(--text-dim)">No breaks</p>';
  }

  let bottlenecks = '';
  const overruns = [];
  for (const dk of Object.keys(r.devices)) {
    for (const st of r.devices[dk].steps) {
      if (st.status === 'completed' && st.delta_minutes > 0) {
        overruns.push({ name: st.name, delta: st.delta_minutes, actual: st.actual_minutes, expected: st.expected_minutes });
      }
    }
  }
  overruns.sort((a, b) => b.delta - a.delta);
  if (overruns.length) {
    bottlenecks = '<ul>' + overruns.slice(0, 8).map(o =>
      `<li><strong>${escHtml(o.name)}</strong> — +${fmtMinutes(o.delta)} (${fmtMinutes(o.actual)} vs ${fmtMinutes(o.expected)})</li>`
    ).join('') + '</ul>';
  }

  let deviceBreakdown = '';
  if (r.device_type_summary) {
    deviceBreakdown = '<ul>' + Object.values(r.device_type_summary).map(d =>
      `<li><strong>${escHtml(d.name)}</strong> x${d.count}: ${fmtMinutes(d.actual_minutes)} / ${fmtMinutes(d.expected_minutes)} (${d.completed_steps}/${d.total_steps} steps)</li>`
    ).join('') + '</ul>';
  }

  const skipped = [];
  for (const dk of Object.keys(r.devices)) {
    for (const st of r.devices[dk].steps) {
      if (st.status === 'skipped') skipped.push(st);
    }
  }

  let skippedHtml = '';
  if (skipped.length) {
    skippedHtml = `<div class="summary-section"><h3>Skipped (${skipped.length})</h3><ul>` +
      skipped.map(s => `<li>${escHtml(s.name)}${s.notes ? ' — ' + escHtml(s.notes) : ''}</li>`).join('') +
      '</ul></div>';
  }

  const gsheetHtml = result.gsheet_url
    ? `<a class="gsheet-link" href="${result.gsheet_url}" target="_blank">Open Google Sheet</a>`
    : '';

  $('summary-content').innerHTML = `
    <div class="header">
      <h2>Deployment Complete</h2>
      <div class="sub">${escHtml(r.deployment)} v${escHtml(r.version)} — ${escHtml(r.deployer)}${r.dry_run ? ' (dry run)' : ''}</div>
    </div>
    <div class="summary-grid">
      <div class="summary-cell"><div class="label">Wall Clock</div><div class="value">${fmtMinutes(wallMin)}</div></div>
      <div class="summary-cell"><div class="label">Expected</div><div class="value">${fmtMinutes(expected)}</div></div>
      <div class="summary-cell"><div class="label">Active Work</div><div class="value">${fmtMinutes(activeMin)}</div></div>
      <div class="summary-cell"><div class="label">Delta</div><div class="value">${deltaSign}${fmtMinutes(Math.abs(delta))} (${deltaSign}${deltaPct}%)</div></div>
      <div class="summary-cell"><div class="label">Steps Total</div><div class="value">${fmtMinutes(r.sum_of_steps_minutes)}</div></div>
      <div class="summary-cell"><div class="label">Overlap</div><div class="value">${fmtMinutes(r.parallel_overlap_minutes)}</div></div>
      <div class="summary-cell"><div class="label">Breaks</div><div class="value">${fmtMinutes(r.total_break_minutes)}</div></div>
      <div class="summary-cell"><div class="label">Completion</div><div class="value">${Object.values(r.devices).reduce((a,d)=>a+d.steps.filter(s=>s.status==='completed').length,0)}/${Object.values(r.devices).reduce((a,d)=>a+d.steps.length,0)}</div></div>
    </div>
    ${deviceBreakdown ? `<div class="summary-section"><h3>Device Breakdown</h3>${deviceBreakdown}</div>` : ''}
    ${bottlenecks ? `<div class="summary-section"><h3>Bottlenecks</h3>${bottlenecks}</div>` : ''}
    <div class="summary-section"><h3>Breaks</h3>${breaksList}</div>
    ${skippedHtml}
    <div class="summary-section" style="text-align:center;color:var(--text-dim);font-size:.85rem">
      Report saved: ${escHtml(result.filepath)}<br/>
      ${gsheetHtml}
    </div>
    <div class="summary-actions">
      <button class="btn-primary" onclick="resetApp()">New Deployment</button>
    </div>`;
  showView('summary');
}

function resetApp() {
  devicesDom = {};
  currentState = null;
  showView('setup');
}

// ── View switching ───────────────────────────────────────

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $(`view-${name}`).classList.add('active');
}

// ── Init ─────────────────────────────────────────────────
loadManifests();
</script>
</body>
</html>
