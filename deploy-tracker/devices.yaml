device_types:
  server:
    name: "Server"
    steps:
      - id: unpack
        name: "Unpack and rack mount"
        expected_minutes: 5
      - id: install_os
        name: "Install OS"
        expected_minutes: 15
      - id: install_cluster
        name: "Install Kubernetes cluster"
        expected_minutes: 10
      - id: deploy_app
        name: "Deploy application stack"
        expected_minutes: 15
      - id: load_map
        name: "Load map into server"
        expected_minutes: 10

  ptz_camera:
    name: "PTZ Camera (Raycam)"
    steps:
      - id: unpack
        name: "Unpack and mount"
        expected_minutes: 10
      - id: configure_network
        name: "Configure network and ONVIF"
        expected_minutes: 10
      - id: register
        name: "Register in platform"
        expected_minutes: 10

  radar_magos:
    name: "Magos Radar"
    steps:
      - id: unpack
        name: "Unpack and mount"
        expected_minutes: 5
      - id: configure
        name: "Configure radar parameters"
        expected_minutes: 5
      - id: register
        name: "Register in platform"
        expected_minutes: 5

  operator_station:
    name: "Operator Station"
    steps:
      - id: unpack
        name: "Unpack and mount"
        expected_minutes: 10
      - id: install_os
        name: "Install OS"
        expected_minutes: 15
      - id: install_software
        name: "Install software"
        expected_minutes: 10
      - id: software_validation
        name: "Validate software"
        expected_minutes: 10
  
  pwf:
    name: "PWF"
    steps:
      - id: unpack
        name: "Unpack and mount"
        expected_minutes: 10
      - id: setup_router
        name: "Setup router (RUTM51) including firmware update"
        expected_minutes: 15
      - id: setup_modem
        name: "Setup modem (OTD500) including firmware update"
        expected_minutes: 15
      - id: setup_switch
        name: "Setup switch (TSW202 / MikroTik) including firmware update"
        expected_minutes: 5

  lidar:
    name: "LiDAR"
    steps:
      - id: unpack
        name: "Unpack and mount"
        expected_minutes: 5
      - id: remove_jumper
        name: "Remove jumper from jetson"
        expected_minutes: 10
      - id: setup_jetson
        name: "Setup Jetson prerequisites"
        expected_minutes: 15
      - id: install_software
        name: "Install software"
        expected_minutes: 60
      - id: setup_lidar
        name: "Setup lidar and register in platform"
        expected_minutes: 10
  
  eysatop_drone:
    name: "Eysatop Drone"
    steps:
      - id: unpack
        name: "Unpack and mount"
        expected_minutes: 30
      - id: setup_rc
        name: "Setup RC controller"
        expected_minutes: 25
      - id: bind_dock
        name: "Bind dock to drone and RC"
        expected_minutes: 15
      - id: remove_jumper
        name: "Remove jumper from jetson"
        expected_minutes: 10
      - id: setup_jetson
        name: "Setup Jetson prerequisites"
        expected_minutes: 15
      - id: install_software
        name: "Install software"
        expected_minutes: 60
      - id: setup_drone
        name: "Setup drone and register in platform"
        expected_minutes: 30
      - id: software_validation
        name: "Validate software"
        expected_minutes: 10
  