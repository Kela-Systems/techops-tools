<!DOCTYPE html>
<!-- Bench Central — dashboard over the run-record audit trail (TEC-575)
     plus the fleet panel (pinned release + station check-ins) and the
     factory-password lookup (TEC-845); the runs side stays read-only. One
     self-contained file, no build step: vanilla JS against the collector's
     own /api/v1 endpoints. Served at / by collector.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bench Central — Run Records</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --line: #e2e5ea; --text: #1c2330;
    --muted: #6b7484; --accent: #2456c4;
    --ok-bg: #e2f4e8; --ok-fg: #176936; --err-bg: #fde8e8; --err-fg: #a02121;
    --na-bg: #eef0f3; --na-fg: #6b7484;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 14px 22px;
           background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 17px; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px 22px 60px; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end;
             background: var(--card); border: 1px solid var(--line);
             border-radius: 8px; padding: 12px; margin-bottom: 14px; }
  .filters label { display: flex; flex-direction: column; gap: 3px;
                   font-size: 11.5px; color: var(--muted); }
  .filters input, .filters select {
    font: inherit; padding: 5px 8px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; min-width: 110px; }
  .filters input[type=search] { min-width: 210px; }
  .filters button { font: inherit; padding: 6px 14px; border-radius: 6px;
                    border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .filters button.primary { background: var(--accent); border-color: var(--accent);
                            color: #fff; }
  .count { color: var(--muted); font-size: 12.5px; margin: 0 0 8px 2px; }

  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  thead th { position: sticky; top: 0; background: #fafbfc; text-align: left;
             font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
             color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  tbody td { padding: 7px 10px; border-bottom: 1px solid var(--line);
             white-space: nowrap; }
  tbody td.err-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis;
                      color: var(--err-fg); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f2f6ff; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 99px;
          font-size: 12px; font-weight: 600; }
  .pill.ok  { background: var(--ok-bg);  color: var(--ok-fg); }
  .pill.err { background: var(--err-bg); color: var(--err-fg); }
  .pill.na  { background: var(--na-bg);  color: var(--na-fg); font-weight: 400; }
  .pill.warn { background: #fbf0d9; color: #8a6210; font-weight: 400; }
  .ver { font: 12px ui-monospace, Menlo, Consolas, monospace; }
  .more { display: block; margin: 14px auto; }
  .empty { text-align: center; color: var(--muted); padding: 30px; }

  /* fleet panel */
  .fleet { background: var(--card); border: 1px solid var(--line);
           border-radius: 8px; padding: 12px; margin-bottom: 14px; }
  .fleet .head { display: flex; flex-wrap: wrap; align-items: center;
                 gap: 10px; margin-bottom: 8px; }
  .fleet h2 { margin: 0; font-size: 14px; }
  .fleet .head .sub { color: var(--muted); font-size: 12.5px; flex: 1; }
  .fleet form { display: flex; gap: 6px; }
  .fleet input { font: inherit; padding: 5px 8px; border: 1px solid var(--line);
                 border-radius: 6px; min-width: 220px; }
  .fleet button { font: inherit; padding: 6px 14px; border-radius: 6px;
                  border: 1px solid var(--accent); background: var(--accent);
                  color: #fff; cursor: pointer; }
  .fleet table { border-radius: 6px; }
  .fleet .empty { padding: 14px; }

  /* factory passwords (TEC-845) — same card shell as the fleet panel */
  .pw { font: 13px ui-monospace, Menlo, Consolas, monospace; cursor: pointer;
        border-bottom: 1px dashed var(--muted); }
  .pw:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .pw.copied { color: var(--ok-fg); border-bottom-color: var(--ok-fg); }
  .pw.copied::after { content: " copied"; font-size: 11px; }

  /* detail modal */
  #overlay { position: fixed; inset: 0; background: rgba(20,26,38,.45);
             display: none; align-items: flex-start; justify-content: center;
             padding: 5vh 16px; overflow: auto; }
  #overlay.open { display: flex; }
  #detail { background: var(--card); border-radius: 10px; max-width: 860px;
            width: 100%; padding: 20px 24px; }
  #detail h2 { margin: 0 0 2px; font-size: 16px; }
  #detail .when { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; }
  #detail .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
                  gap: 8px 18px; margin-bottom: 14px; }
  #detail .grid div b { display: block; font-size: 11px; color: var(--muted);
                        text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  #detail h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em;
               color: var(--muted); margin: 16px 0 6px; }
  #detail table td, #detail table th { white-space: normal; }
  #detail .error-box { background: var(--err-bg); color: var(--err-fg);
                       border-radius: 6px; padding: 8px 12px; }
  #detail pre { background: #10141c; color: #cdd6e4; border-radius: 8px;
                padding: 12px; max-height: 320px; overflow: auto;
                font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #detail pre .warn { color: #f0c674; } #detail pre .err { color: #ff8f8f; }
  #detail .close { float: right; border: none; background: none; font-size: 20px;
                   cursor: pointer; color: var(--muted); }
  .checkmark { color: var(--ok-fg); } .cross { color: var(--err-fg); }
</style>
</head>
<body>
<header>
  <h1>Bench Central — Run Records</h1>
  <span class="sub" id="health">…</span>
</header>
<main>
  <section class="fleet">
    <div class="head">
      <h2>Fleet</h2>
      <span class="sub" id="pin-info">…</span>
      <form id="pin-form" onsubmit="return false">
        <input id="pin-ref" placeholder="ref to pin (main, a tag, a sha)">
        <button id="pin-apply">Pin release</button>
      </form>
    </div>
    <table>
      <thead><tr>
        <th>Station</th><th>Hostname</th><th>Platform</th><th>Version</th>
        <th>First seen (UTC)</th><th>Last seen (UTC)</th>
      </tr></thead>
      <tbody id="fleet-rows"></tbody>
    </table>
  </section>

  <section class="fleet">
    <div class="head">
      <h2>Factory passwords</h2>
      <span class="sub" id="labels-info">…</span>
      <form id="labels-form" onsubmit="return false">
        <input id="label-q" type="search" placeholder="serial, MAC or model">
        <button id="label-search">Look up</button>
      </form>
    </div>
    <table>
      <thead><tr>
        <th>Serial</th><th>MAC</th><th>Device</th><th>Factory password</th>
        <th>Read</th><th>First seen (UTC)</th><th>Last seen (UTC)</th>
        <th>Station</th>
      </tr></thead>
      <tbody id="label-rows"></tbody>
    </table>
    <button class="more" id="labels-more" hidden>Load more</button>
  </section>

  <form class="filters" id="filters" onsubmit="return false">
    <label>Search (serial / MAC / hostname / site / operator)
      <input type="search" id="q" placeholder="e.g. 6008952944"></label>
    <label>Station <select id="station_id"><option value="">all</option></select></label>
    <label>Device type <select id="tool"><option value="">all</option></select></label>
    <label>Site <select id="site"><option value="">all</option></select></label>
    <label>Outcome
      <select id="status">
        <option value="">all</option><option value="ok">ok</option>
        <option value="error">error</option>
      </select></label>
    <label>From <input type="date" id="since"></label>
    <label>To <input type="date" id="until"></label>
    <button class="primary" id="apply">Apply</button>
    <button id="reset">Reset</button>
  </form>

  <p class="count" id="count"></p>
  <table>
    <thead><tr>
      <th>Time (UTC)</th><th>Device</th><th>Serial</th><th>Hostname</th>
      <th>Site</th><th>Station</th><th>Operator</th><th>Bench ver</th>
      <th>Outcome</th><th>Verified</th><th>Took</th><th>Error</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <button class="more" id="more" hidden>Load more</button>
</main>

<div id="overlay"><div id="detail"></div></div>

<script>
"use strict";
const TOOL_NAMES = {otd: "OTD500", rutm: "RUTM08", tsw: "TSW202",
                    raythink: "Raythink", speaker: "Speaker",
                    "magos-radar": "Magos Radar", "magos-apu": "Magos APU"};
const PAGE = 100;
let offset = 0, total = 0;
let labelOffset = 0, labelTotal = 0;
// ONE version reference on this page: the pinned release (full sha, set by
// loadFleet before anything renders). Station rows AND run rows are compared
// against it — amber means "not on the pinned release". Versions come in
// different lengths (40-char check-ins, 12-char bundle stamps, 7-char git
// stamps from pre-fleet benches), so matching is by prefix.
let desiredVersion = null;

function sameRelease(a, b) {
  return !!(a && b && (a.startsWith(b) || b.startsWith(a)));
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function pill(kind, text) { return `<span class="pill ${kind}">${esc(text)}</span>`; }
function outcomePill(status) { return pill(status === "ok" ? "ok" : "err", status); }
function verifiedPill(v) {
  if (v === true)  return pill("ok", "verified");
  if (v === false) return pill("err", "failed");
  return pill("na", "n/a");
}
function took(s) {
  if (s == null) return "";
  return s >= 60 ? `${Math.floor(s / 60)}m${String(s % 60).padStart(2, "0")}s` : `${s}s`;
}
function when(iso) {
  if (!iso) return "";
  return iso.replace("T", " ").replace(/([.+].*|Z)$/, "").slice(0, 19);
}
function versionCell(v) {
  if (!v || v === "unknown") return pill("na", "?");
  const short = v.slice(0, 12);
  if (desiredVersion && !sameRelease(v, desiredVersion))
    return `<span class="pill warn ver" title="pinned: ${esc(desiredVersion.slice(0, 12))}">${esc(short)}</span>`;
  return `<span class="ver">${esc(short)}</span>`;
}

// ── fleet panel ───────────────────────────────────────────────────────────

function fleetVersionCell(v) {
  if (!v || v === "unknown") return pill("na", "?");
  const short = v.slice(0, 12);
  if (desiredVersion && !sameRelease(v, desiredVersion))
    return `<span class="pill warn ver" title="pinned: ${esc(desiredVersion.slice(0, 12))}">${esc(short)}</span>`;
  return `<span class="pill ok ver">${esc(short)}</span>`;
}

async function loadFleet() {
  const data = await (await fetch("api/v1/fleet/stations")).json();
  desiredVersion = data.desired.version;
  $("pin-info").textContent = desiredVersion
    ? `pinned: ${desiredVersion.slice(0, 12)} (${data.desired.ref}) · ${when(data.desired.pinned_at)} UTC`
    : "no release pinned — stations launch whatever is on disk";
  $("fleet-rows").innerHTML = data.stations.map(s => `
    <tr>
      <td>${esc(s.station_id)}</td>
      <td>${esc(s.hostname || "")}</td>
      <td>${esc(s.platform || "")}</td>
      <td>${fleetVersionCell(s.version)}</td>
      <td>${esc(when(s.first_seen))}</td>
      <td>${esc(when(s.last_seen))}</td>
    </tr>`).join("")
    || `<tr><td colspan="6" class="empty">No stations have checked in yet.</td></tr>`;
}

async function pinRelease() {
  const ref = $("pin-ref").value.trim();
  if (!ref) return;
  $("pin-apply").disabled = true;
  try {
    const resp = await fetch("api/v1/fleet/desired", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ref}),
    });
    if (!resp.ok) {
      let detail = `HTTP ${resp.status}`;
      try { detail = (await resp.json()).detail || detail; } catch {}
      alert(`Pin failed: ${detail}`);
      return;
    }
    $("pin-ref").value = "";
    await loadFleet();
  } finally {
    $("pin-apply").disabled = false;
  }
}

// ── factory passwords (TEC-845) ───────────────────────────────────────────
//
// The factory-label password a Teltonika shipped with, kept so a unit
// factory-reset in the field is still reachable. Shown in the clear: it is a
// value printed on the outside of the device, and the whole point of keeping
// it is that somebody can read it back off this page.

function copyPassword(el) {
  const done = () => {
    el.classList.add("copied");
    setTimeout(() => el.classList.remove("copied"), 1200);
  };
  // The async clipboard API needs a secure context, and the dashboard is
  // plain http over the tailnet — so the deprecated path is the working one
  // here, with the modern one tried first for whoever fronts this with TLS.
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(el.dataset.pw).then(done, () => {});
    return;
  }
  const scratch = document.createElement("textarea");
  scratch.value = el.dataset.pw;
  scratch.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(scratch);
  scratch.select();
  try { if (document.execCommand("copy")) done(); } catch { /* select it by hand */ }
  scratch.remove();
}

function labelRow(l) {
  // A device's factory password is printed on it and cannot change, so two
  // different readings mean a mis-scan or a typo somewhere — worth flagging,
  // since the stored value is then only probably right.
  const conflict = l.conflicts
    ? ` <span class="pill warn" title="${l.conflicts} reading(s) disagreed with this one — check the sticker">?</span>`
    : "";
  return `
    <tr>
      <td>${esc(l.serial)}</td>
      <td class="ver">${esc(l.mac || "")}</td>
      <td>${esc(l.model || TOOL_NAMES[l.tool] || l.tool || "")}</td>
      <td><span class="pw" data-pw="${esc(l.password)}"
                title="Click to copy">${esc(l.password)}</span>${conflict}</td>
      <td>${pill("na", l.source === "scan" ? "scanned" : "typed")}</td>
      <td>${esc(when(l.first_seen))}</td>
      <td>${esc(when(l.last_seen))}</td>
      <td>${esc(l.station_id || "")}</td>
    </tr>`;
}

async function loadLabels(append) {
  if (!append) labelOffset = 0;
  const p = new URLSearchParams({limit: PAGE, offset: labelOffset});
  const needle = $("label-q").value.trim();
  if (needle) p.set("q", needle);
  const data = await (await fetch("api/v1/device-labels?" + p)).json();
  labelTotal = data.total;
  const html = data.labels.map(labelRow).join("");
  if (append) $("label-rows").insertAdjacentHTML("beforeend", html);
  else $("label-rows").innerHTML = html || `<tr><td colspan="8" class="empty">${
    needle ? "No device matches." : "No factory passwords on record yet."
  }</td></tr>`;
  labelOffset += data.labels.length;
  $("labels-info").textContent = needle
    ? `${labelTotal} device(s) match "${needle}"`
    : `${labelTotal} device(s) on record`;
  $("labels-more").hidden = labelOffset >= labelTotal;
}

function query() {
  const p = new URLSearchParams();
  for (const id of ["q", "station_id", "tool", "site", "status"]) {
    const v = $(id).value.trim();
    if (v) p.set(id, v);
  }
  if ($("since").value) p.set("since", $("since").value);
  // The date input gives a day; extend to its very end so "To" is inclusive.
  if ($("until").value) p.set("until", $("until").value + "T23:59:59.999999");
  return p;
}

async function load(append) {
  if (!append) offset = 0;
  const p = query();
  p.set("limit", PAGE);
  p.set("offset", offset);
  const data = await (await fetch("api/v1/runs?" + p)).json();
  total = data.total;
  const html = data.runs.map(r => `
    <tr data-id="${esc(r.run_id)}">
      <td>${esc(when(r.timestamp || r.received_at))}</td>
      <td>${esc(TOOL_NAMES[r.tool] || r.tool || "?")}</td>
      <td>${esc(r.serial)}</td>
      <td>${esc(r.hostname || "")}</td>
      <td>${esc(r.site || "")}</td>
      <td>${esc(r.station_id || "")}</td>
      <td>${esc(r.operator || "")}</td>
      <td>${versionCell(r.bench_version)}</td>
      <td>${outcomePill(r.status)}</td>
      <td>${verifiedPill(r.verified)}</td>
      <td>${esc(took(r.duration_s))}</td>
      <td class="err-cell" title="${esc(r.error || "")}">${esc(r.error || "")}</td>
    </tr>`).join("");
  if (append) $("rows").insertAdjacentHTML("beforeend", html);
  else $("rows").innerHTML = html || `<tr><td colspan="12" class="empty">No runs match.</td></tr>`;
  offset += data.runs.length;
  $("count").textContent = total ? `Showing ${offset} of ${total} runs` : "";
  $("more").hidden = offset >= total;
}

async function factoryPassword(serial) {
  // Looked up by serial rather than carried in the record: it belongs to the
  // device, not to this run, so a unit read once shows its password on every
  // run it ever had — including the ones from before it was being kept.
  if (!serial || serial === "unknown") return null;
  const resp = await fetch("api/v1/device-labels/" + encodeURIComponent(serial));
  return resp.ok ? await resp.json() : null;
}

async function openDetail(runId) {
  const r = await (await fetch("api/v1/runs/" + encodeURIComponent(runId))).json();
  const d = r.device || {};
  const label = await factoryPassword(r.serial);
  const core = {
    Serial: r.serial, MAC: r.mac, Model: r.model, Firmware: r.firmware,
    Hostname: d.hostname, Site: d.site_name, Channel: d.channel, IP: d.ip,
    "Radar IP": d.radar_ip, Station: r.station_id, Operator: r.operator,
    "Bench version": r.bench_version, Took: took(r.duration_s),
  };
  const grid = Object.entries(core).filter(([, v]) => v != null && v !== "")
    .map(([k, v]) => `<div><b>${esc(k)}</b>${esc(v)}</div>`).join("")
    + (label ? `<div><b>Factory password</b><span class="pw"
         data-pw="${esc(label.password)}" title="Click to copy"
         >${esc(label.password)}</span></div>` : "");
  const checks = (r.verification || []).map(c => `
    <tr><td>${c.ok === true ? '<span class="checkmark">✓</span>'
             : c.ok === false ? '<span class="cross">✗</span>' : "–"}</td>
        <td>${esc(c.item)}</td><td>${esc(c.expected ?? "")}</td>
        <td>${esc(c.actual ?? "")}</td></tr>`).join("");
  const warnings = (r.warnings || []).map(w => `<li>${esc(w)}</li>`).join("");
  const steps = (r.steps || []).map(s => {
    const cls = s.level === "warning" ? "warn" : s.level === "error" ? "err" : "";
    return `<span class="${cls}">[${esc(s.time)}] [${esc(s.sn)}] ${esc(s.msg)}</span>`;
  }).join("\n");

  $("detail").innerHTML = `
    <button class="close" onclick="$('overlay').classList.remove('open')">✕</button>
    <h2>${esc(TOOL_NAMES[r.tool] || r.tool)} — ${esc(r.serial)}
        ${outcomePill(r.status)} ${verifiedPill(r.verified)}</h2>
    <div class="when">${esc(when(r.timestamp))} UTC · run ${esc(r.run_id)}</div>
    <div class="grid">${grid}</div>
    ${r.error ? `<div class="error-box">${esc(r.error)}</div>` : ""}
    ${r.verify_detail && r.verified === false
      ? `<div class="error-box" style="margin-top:8px">${esc(r.verify_detail)}</div>` : ""}
    ${checks ? `<h3>Verification</h3><table><thead><tr><th></th><th>Check</th>
        <th>Expected</th><th>Actual</th></tr></thead><tbody>${checks}</tbody></table>` : ""}
    ${warnings ? `<h3>Warnings</h3><ul>${warnings}</ul>` : ""}
    ${steps ? `<h3>Step log</h3><pre>${steps}</pre>` : ""}`;
  $("overlay").classList.add("open");
}

async function boot() {
  // The collector's own revision stays out of the header (it lives in
  // /api/v1/health for debugging) — the pin in the Fleet panel is the only
  // version reference shown on this page.
  const [health, filters] = await Promise.all([
    (await fetch("api/v1/health")).json(),
    (await fetch("api/v1/filters")).json(),
  ]);
  $("health").textContent = `${health.runs} runs on record`;
  const fill = (id, values, labels) => {
    for (const v of values) {
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = labels ? (labels[v] || v) : v;
      $(id).appendChild(opt);
    }
  };
  fill("station_id", filters.stations);
  fill("tool", filters.tools, TOOL_NAMES);
  fill("site", filters.sites);
  // Fleet first: the run rows are compared against the pin it sets.
  await loadFleet();
  await Promise.all([load(false), loadLabels(false)]);
}

$("pin-apply").addEventListener("click", pinRelease);
$("pin-ref").addEventListener("keydown", e => { if (e.key === "Enter") pinRelease(); });
$("label-search").addEventListener("click", () => loadLabels(false));
$("label-q").addEventListener("keydown", e => { if (e.key === "Enter") loadLabels(false); });
$("labels-more").addEventListener("click", () => loadLabels(true));
// One delegated handler for every password cell, in the table and the modal.
document.addEventListener("click", e => {
  const cell = e.target.closest(".pw");
  if (cell) copyPassword(cell);
});
$("apply").addEventListener("click", () => load(false));
$("reset").addEventListener("click", () => {
  $("filters").reset();
  load(false);
});
$("q").addEventListener("keydown", e => { if (e.key === "Enter") load(false); });
$("more").addEventListener("click", () => load(true));
$("rows").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-id]");
  if (tr) openDetail(tr.dataset.id);
});
$("overlay").addEventListener("click", e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove("open");
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("overlay").classList.remove("open");
});

boot();
