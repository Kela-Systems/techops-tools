# kela-fob-03 — re-assessed 2026-09-14 against bench-central (284 run
# records, 33 device labels) at techops-automations-host:8100, and against a
# read-only ICMP sweep of the subnet run from the site server (.10).
#
# WHAT THE RE-ASSESSMENT ESTABLISHED
#
#   proven   8 devices answered at 8 addresses; their MACs; their vendors
#   NOT      the model of ANY of them
#   NOT      the firmware of ANY of them
#   NOT      what is plugged into what
#   NOT      what powers what
#
# WHAT CHANGED SINCE — 2026-09-14, by reading devices' own APIs from the site
# server (never from a bench station), each reading accepted only after the
# device's self-reported MAC matched the router's ARP observation:
#
#   proven   model + firmware on 7 of 10: two radars (SR1000-I), two cameras
#            (SG-PTZ), the server and the operator station (both Dell), and
#            the router (RUTM08 / RUTM_R_00.07.24.3)
#   proven   the first cabling fact: every device sits behind router port
#            lan3, from the router's own bridge forwarding table
#   proven   the LAN's uplink is the router, whose WAN talks to another
#            Teltonika at 192.168.1.1
#   proven   .1 is the subnet's DHCP server, DNS resolver and gateway, from
#            the leases held by two independent clients
#   proven   .10 and .29 hold DHCP LEASES, not statics
#   still    NOT the model of .118, .132 or .133 — two distinct reasons,
#   NOT      spelled out at the foot of this file
#   still    NOT which switch port each device is on, and NOT what powers
#   NOT      anything at all
#
# Three inferred shortlists have now been checked against hardware. TWO WERE
# WRONG: the radars were shortlisted AR-300/SR1000-F/SR500-F and read as
# SR1000-I; the cameras were shortlisted PC464A1 and read as SG-PTZ, a
# different class of device. ONE WAS RIGHT: the router was shortlisted RUTM08
# and reads as RUTM08. All three were derived correctly from real archive
# data. That is the whole argument for the three tiers — a shortlist is a
# lead, leads are sometimes right, and the only way to tell which is to read
# the device.
#
# None of these 8 MACs appears in bench-central, in either MAC spelling the
# archive uses. There is also no `kela-fob-03` site in it at all (it holds
# kela-fob-09-new, -11, -22..-26 and -backup). So this site was either never
# provisioned through the bench, provisioned before central shipping was
# switched on, or filed under another label. A miss is NOT evidence of
# anything: central shipping is opt-in per station (BENCH_CENTRAL_URL).
#
# `candidates:` below is a SHORTLIST, never a model. It comes from vendor
# correlation across the archive's 284 runs, which narrows the field without
# settling anything. Only the device's own API, or a bench record of it, can
# fill in `model:`.
version: 1
site: kela-fob-03
status: provisional
subnet: 192.168.88.0/24

# `uplink: router` — the LAN's way out, read rather than assumed. The DHCP
# leases on .10 and .29 both name .1 as gateway/DHCP/DNS, and the router's own
# neighbour table (2026-09-14) shows its `wan` interface talking to
# 192.168.1.1 at 20:97:27:25:8f:0d — REACHABLE, another Teltonika, one hop
# upstream. Almost certainly the OTD500 behind the otd-kela-fob-03 Tailscale
# peer: its MAC sits in the 2097272b-20972749 range the archive associates
# with OTD500/RUTM08 rather than the a0 block the TSW202s use.
#
# "Almost certainly" is not read, so the OTD500 is still NOT a node here. What
# IS settled is that this router does not reach the carrier itself — its own
# hwinfo reports mobile=false and dual_sim=false, the RUTM08 being the
# non-cellular RUT-M — so something upstream does, and 192.168.1.1 is it.
uplink: router

reservations:
  infra:
    range: 1-3
    owner: bench
  cameras:
    range: 30-50
    owner: bench
    dynamic: true
    # Worth noting: this site's Magos units are on .130-.133, so the
    # camera/radar overlap at .50 that the template trips on does not arise
    # here. The documented .50-.53 radar plan is not what this site uses.

nodes:
  router:
    kind: router
    vendor: Teltonika Networks
    model: RUTM08
    firmware: RUTM_R_00.07.24.3
    mac: 20:97:27:36:55:ec
    addr: 192.168.88.1
    addr_source: static-manual
    # Read on the device 2026-09-15 with `ip -4 addr show`, over a read-only
    # session. `addr` above is the LAN leg, which is the one a site map is
    # about; these are all three of them. The WAN address is private but is
    # NOT this site's subnet - it is the link to the Teltonika upstream at
    # 192.168.1.1 - so scope here is taken from the interface name rather
    # than from whether the address happens to be RFC1918.
    interfaces:
      - name: br-lan
        addr: 192.168.88.1
        prefix: 24
        scope: internal
      - name: tailscale0
        addr: 100.64.242.104
        prefix: 32
        scope: external
        note: the tailnet address, and how this survey reached the site
      - name: wan
        addr: 192.168.1.164
        prefix: 24
        scope: external
        note: uplink to another Teltonika at 192.168.1.1
    evidence:
      "*": arp
      model: device-api
      firmware: device-api
      # Upgraded from arp: the addresses below were read on the device with
      # `ip -4 addr show`, not observed from outside it.
      addr: device-api
    verified_at: 2026-09-14
    critical: true
    roles: [dhcp-server, dns-resolver, default-gateway]
    notes: >-
      Read off the device 2026-09-14 over SSH and REST. `ubus call system
      board` reports model "Teltonika RUTM08" outright, which settles what the
      OUI could not — Teltonika makes the OTD500 and TSW202 on this same
      20:97:27 prefix. The inferred shortlist (RUTM08, from it being the only
      RUT-M model in 52 archived rutm runs) was RIGHT this time. Worth
      recording precisely because the radar and camera shortlists were both
      wrong: a shortlist is a lead, and a lead can be correct — which is why
      "~" has to stay visually distinct from "✓" in either direction.

      Serial 6008952997, hardware version 0004, batch 0037, bootloader
      2.23.3. Self-reported LAN MAC 2097273655EC matches the ARP observation
      at .1 exactly; the WAN port is one higher at ...:ED. Running OpenWrt
      21.02.0 (r16279-5cc0535800) on kernel 6.6.126, MediaTek MT7621. The
      hwinfo block reports mobile=false and dual_sim=false, consistent with
      the RUTM08 being the non-cellular RUT-M — so this site's path to the
      carrier is NOT through this device's own modem.

      Firmware RUTM_R_00.07.24.3 is already the version
      avis/tec-861-teltonika-firmware-upgrade-path-to-07243-security-across
      is written to roll out, so this unit needs nothing from that work.

      What IS now settled is what this device DOES, read 2026-09-14 from the
      DHCP leases held on two independent hosts (the server at .10 and the
      operator station at .29). Both leases name
      SERVER_ADDRESS=192.168.88.1, ROUTER=192.168.88.1 and DNS=192.168.88.1,
      and `networkctl` on .29 reports "Address: 192.168.88.29 (DHCP4 via
      192.168.88.1)". So this device is the subnet's DHCP server, its
      default gateway and its DNS resolver. That is two separate clients
      agreeing, not an inference from the .1 address.

      `addr_source` is therefore static-manual rather than static-bench: a
      DHCP server does not lease its own address, so .1 is configured on the
      device — but nothing shows the bench configured it, and static-bench
      would claim that.

