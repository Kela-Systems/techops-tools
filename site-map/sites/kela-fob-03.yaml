# SWEEP RESULT — a read-only ICMP sweep of all 254 addresses, run from the
# site server, then re-reading its neighbour table. Nine devices answered:
# .1, .10, .29, .30, .31, .118, .130, .131, .132, .133.
#
# These addresses did NOT answer:
#   192.168.88.2    where the bench puts a TSW202
#   192.168.88.3    where the bench puts the PLANET IGS-4215 PoE switch
#   192.168.88.70   where the bench puts the speaker
#
# A sweep is much stronger evidence of absence than an ARP table, because it
# solicits every address rather than reporting past conversations. So this
# site most likely has NO PLANET PoE switch and NO speaker. Which raises the
# question the model cannot answer: if there is no PoE switch, what powers
# four radars? Either an unmanaged injector or midspan (invisible to every
# protocol) or the .118 device. That is a survey question.
#
# Tailscale also lists peers otd-kela-fob-03, kela-fob-03-operator and
# kela-fob-03 at this site. The OTD500 did not answer on this subnet at all,
# so it is presumably upstream of the router on the WAN side.
#
# NO net: OR power: BLOCK. An ARP sweep proves no cable and no feed. The
# PLANET's MAC-address table would establish the cabling; its PoE port status
# would establish the powered half. The DC and mains side cannot be
# established by any protocol and needs a survey.

# PORT PROFILES — read-only TCP connect checks from the site server,
# 2026-09-14. Not a model, but it does corroborate each device's family and
# tells us which transport a probe would have to use:
#
#   .1    22/80/443 open   RutOS: SSH + HTTPS management
#   .118  22/80/443 open   same profile — see teltonika_118's basis note
#   .130  22/80/443 open   Magos dashboard API over HTTP
#   .131  22/80/443 open   same
#   .132  NOTHING OPEN     full connect scan of 1-10240, zero ports
#   .133  NOTHING OPEN     same
#   .30   80 only          Raythink RPC2 is HTTP-only; no SSH, no TLS
#   .29   22 only          sshd offering password auth ONLY, no publickey
#
# The .132/.133 result is the load-bearing one, so it was taken the strongest
# way available: all 10240 ports, from the site server, on the same segment,
# in the same run that found three open ports on .130 and .131. Those two
# radars are not listening on anything, which is why no port forward and no
# credential can reach them.
#
# WHAT IS STILL UNREAD, AND WHY — 2026-09-14. Six of ten devices now carry a
# model and a firmware read off the device's own API. The remaining four are
# blocked for three different reasons, and the difference matters because
# only one of them is a credential problem:
#
#   .132, .133  radar_3, radar_4 — NOTHING TO QUERY. Alive on the network,
#      serving no TCP port at all (see PORT PROFILES above). No credential,
#      tunnel or port forward can reach a service that is not listening.
#      This needs console or physical access, or the router's view.
#
#   .1, .118  router, teltonika_118 — NO CREDENTIAL ON THIS MACHINE. The
#      rutm/tsw/otd bench configs hold example values only. The transport
#      that once looked like a second blocker is NOT one: both devices are
#      Tailscale peers (rut-kela-fob-03, and the site's otd-kela-fob-03),
#      so they are directly addressable and the SOCKS-proxy problem —
#      paramiko ignores ALL_PROXY, and TeltonikaClient takes a bare host
#      with no port override — never arises. A real RutOS password is the
#      only thing missing. .118 is the highest-value target left: if it is a
#      TSW202 it holds the MAC address table that answers the cabling
#      question, which nothing else here can.
#
# The bench-station hazard still applies to every probe and is not a blocker
# so much as a standing rule: this subnet is 192.168.88.0/24 at every site
# AND on the bench, and a bench Mac carries a 192.168.88.10 alias on its USB
# NIC. Probing .130 from there reaches whatever is on the bench — the same
# address, a different device, and an answer that looks perfectly valid.
# Every probe runs from the site server or through a tunnel to it, and every
# reading recorded above was accepted only after the device's self-reported
# MAC matched the router's ARP observation. That cross-check is what makes
# these device-api claims trustworthy rather than merely plausible.
#
# Contacting a production device with a credential still needs explicit
# operator approval each time.

# SECURITY FINDING — 2026-09-14. Both readable radars (.130, .131) accepted
# the Magos FACTORY DEFAULT login, admin/password. This was not guessed: it is
# the value in the bench tool's own magos config, whose comment documents it
# as what a fresh AR-300 boots with, and it authenticated on the first attempt
# against both units. So these radars were never moved off the vendor default
# after installation.
#
# Why this sits here rather than in a node note: it is a property of the site,
# it applies to every Magos unit installed the same way (so other sites are
# worth checking), and the two unreachable radars at .132/.133 cannot be
# checked at all. Nothing was changed — rotating a live radar password is a
# write to production and is the operator's call.
#
# A much smaller related point, already fixed on 2026-09-14: the bench repo
# tracked bench/magos-config-ui/config/magos.config.json, because magos was
# the one tool with no gitignore rule for its live config. The committed
# values are these same factory defaults, so nothing secret leaked — but the
# file is edited per station, and the next real password would have been
# committed silently.
