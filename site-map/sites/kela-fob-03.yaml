      AN UNPROVISIONED MANAGED SWITCH IN PRODUCTION is worth an operator's
      attention on its own: no hostname, no known credential, and nothing
      about its configuration has ever been verified. It is also the last
      thing standing between this map and a full cabling answer — a managed
      switch holds the per-port MAC table, and the router's own table (below)
      proves every device at this site sits behind it.

# SWEEP RESULT — a read-only ICMP sweep of all 254 addresses, run from the
# site server, then re-reading its neighbour table. Nine devices answered:
# .1, .10, .29, .30, .31, .118, .130, .131, .132, .133.
#
# These addresses did NOT answer:
#   192.168.88.2    where the bench puts a TSW202
#   192.168.88.3    where the bench puts the PLANET IGS-4215 PoE switch
#   192.168.88.70   where the bench puts the speaker
#
# A sweep is much stronger evidence of absence than an ARP table, because it
# solicits every address rather than reporting past conversations. So this
# site most likely has NO PLANET PoE switch and NO speaker. Which raises the
# question the model cannot answer: if there is no PoE switch, what powers
# four radars? Either an unmanaged injector or midspan (invisible to every
# protocol) or the .118 device. That is a survey question.
#
# Tailscale also lists peers otd-kela-fob-03, kela-fob-03-operator and
# kela-fob-03 at this site. The OTD500 did not answer on this subnet at all,
# so it is presumably upstream of the router on the WAN side.
#
# ONE net: EDGE, AND WHAT IT RULES OUT. The router's bridge forwarding
# database was read on 2026-09-14 (`bridge fdb show` over SSH, a read). A
# RUTM08 has a three-port DSA switch, and the FDB places a learned MAC on the
# physical port it came in on — which is the cabling question, for whatever is
# plugged into the router.
#
# Every learned MAC at this site — both PCs, both cameras, ALL FOUR radars,
# and the .118 switch — sits on ONE port, lan3. lan1 and lan2 are
# NO-CARRIER/LOWERLAYERDOWN: nothing is plugged into them at all.
#
# So the shape is settled even though the detail is not: a single cable leaves
# the router's lan3 and everything else hangs off the switch behind it. That is
# recorded below as one net: edge with switch-table evidence. What the router
# CANNOT say is which .118 port each device is on — those MACs are learned on
# lan3 because they arrive through the switch, not because they are wired to
# the router. Per-device ports need the TSW202's own MAC table, which is
# blocked on its credential (see teltonika_118).
#
# Two things the FDB settles that nothing else could:
#   - radar_3/.132 and radar_4/.133 ARE cabled and forwarding at layer 2. They
#     appear in the FDB like every other device. Combined with answering ICMP
#     and serving no TCP port, that narrows the fault to their software rather
#     than their cabling or power.
#   - 20:97:27:a0:ec:75 is on lan3 too — same Teltonika sub-block as the .118
#     switch, five higher, no IP address and no DHCP lease. Most likely a
#     second MAC belonging to that same switch, but that is a guess and it is
#     recorded rather than resolved. If it is a SECOND switch, this site has an
#     undocumented one. A survey settles it.
#
# The router's neighbour table also carries 192.168.88.90 in FAILED state:
# something asked for .90 recently and got no answer. No device is known at
# .90 and the documented speaker address is .70. Noted, not explained.
#
# STILL NO power: BLOCK. Nothing read so far says anything about what feeds
# what. PoE port status would establish the powered half, and the DC and mains
# side cannot be established by any protocol at all — that needs a survey.
net:
  - from: router
    to: teltonika_118
    port: lan3
    media: ethernet
    evidence: switch-table
    verified_at: 2026-09-14
    notes: >-
      The router's bridge FDB learns EVERY site MAC on lan3, and lan1/lan2
      have no carrier, so one cable leaves the router and the rest of the site
      is behind the .118 switch. This edge is the part that is proven. The
      port on the .118 end is unknown — `peer_port` is deliberately absent
      rather than guessed — and so is every device-to-switch-port pairing,
      because the router cannot see past its own port. The TSW202's own MAC
      table is what completes this, and that needs its credential.

# PORT PROFILES — read-only TCP connect checks from the site server,
# 2026-09-14. Not a model, but it does corroborate each device's family and
# tells us which transport a probe would have to use:
#
#   .1    22/80/443 open   RutOS: SSH + HTTPS management
#   .118  22/80/443 open   same profile — see teltonika_118's basis note
#   .130  22/80/443 open   Magos dashboard API over HTTP
#   .131  22/80/443 open   same
#   .132  NOTHING OPEN     full connect scan of 1-10240, zero ports
#   .133  NOTHING OPEN     same
#   .30   80 only          Raythink RPC2 is HTTP-only; no SSH, no TLS
#   .29   22 only          sshd offering password auth ONLY, no publickey
#
# The .132/.133 result is the load-bearing one, so it was taken the strongest
# way available: all 10240 ports, from the site server, on the same segment,
# in the same run that found three open ports on .130 and .131. Those two
# radars are not listening on anything, which is why no port forward and no
# credential can reach them.
#
# WHAT IS STILL UNREAD, AND WHY — 2026-09-14. Six of ten devices now carry a
# model and a firmware read off the device's own API. The remaining four are
# blocked for three different reasons, and the difference matters because
# only one of them is a credential problem:
#
#   .132, .133  radar_3, radar_4 — NOTHING TO QUERY. Alive on the network,
#      serving no TCP port at all (see PORT PROFILES above). No credential,
#      tunnel or port forward can reach a service that is not listening.
#      The router's FDB does narrow it: both MACs are learned on lan3 like
#      every working device, so they are cabled and forwarding at layer 2.
#      The fault is above the link, not in it. Settling the model needs
#      console or physical access.
#
#   .118  teltonika_118 — NEVER PROVISIONED, so no credential exists for it
#      here. Its DHCP lease still carries the Teltonika factory hostname
#      "TSW202" while every provisioned device carries a real one, and the
#      shared bench password is rejected on both SSH and REST. It is on its
#      per-device factory label password, which lives on the unit's sticker
#      and, for bench-provisioned units, in bench-central keyed by serial —
#      circular here, because the serial is what a login would tell us.
#      Someone has to read the label. This is the last blocker on a complete
#      cabling answer: it holds the per-port MAC table, and the router has
#      already proven everything is behind it.
#
#      The router at .1, by contrast, is DONE — the shared bench password
#      worked on both channels and it read out cleanly. Worth noting what
#      that cost: nothing, once the transport question dissolved. Both
#      Teltonikas are Tailscale peers, so the SOCKS-proxy problem (paramiko
#      ignores ALL_PROXY, and TeltonikaClient takes a bare host with no port
#      override) never arose — .1 was reachable at its Tailscale address
#      directly, which also cannot collide with the bench subnet.
#
# The bench-station hazard still applies to every probe and is not a blocker
# so much as a standing rule: this subnet is 192.168.88.0/24 at every site
# AND on the bench, and a bench Mac carries a 192.168.88.10 alias on its USB
# NIC. Probing .130 from there reaches whatever is on the bench — the same
# address, a different device, and an answer that looks perfectly valid.
# Every probe runs from the site server or through a tunnel to it, and every
# reading recorded above was accepted only after the device's self-reported
# MAC matched the router's ARP observation. That cross-check is what makes
# these device-api claims trustworthy rather than merely plausible.
#
# Contacting a production device with a credential still needs explicit
# operator approval each time.

# SECURITY FINDING — 2026-09-14. Both readable radars (.130, .131) accepted
# the Magos FACTORY DEFAULT login, admin/password. This was not guessed: it is
# the value in the bench tool's own magos config, whose comment documents it
# as what a fresh AR-300 boots with, and it authenticated on the first attempt
# against both units. So these radars were never moved off the vendor default
# after installation.
#
# Why this sits here rather than in a node note: it is a property of the site,
# it applies to every Magos unit installed the same way (so other sites are
# worth checking), and the two unreachable radars at .132/.133 cannot be
# checked at all. Nothing was changed — rotating a live radar password is a
# write to production and is the operator's call.
#
# A much smaller related point, already fixed on 2026-09-14: the bench repo
# tracked bench/magos-config-ui/config/magos.config.json, because magos was
# the one tool with no gitignore rule for its live config. The committed
# values are these same factory defaults, so nothing secret leaked — but the
# file is edited per station, and the next real password would have been
# committed silently.
