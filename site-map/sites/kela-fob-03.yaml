# kela-fob-03 — re-assessed 2026-09-14 against bench-central (284 run
# records, 33 device labels) at techops-automations-host:8100, and against a
# read-only ICMP sweep of the subnet run from the site server (.10).
#
# WHAT THE RE-ASSESSMENT ESTABLISHED
#
#   proven   8 devices answered at 8 addresses; their MACs; their vendors
#   NOT      the model of ANY of them
#   NOT      the firmware of ANY of them
#   NOT      what is plugged into what
#   NOT      what powers what
#
# WHAT CHANGED SINCE — 2026-09-14, by reading devices' own APIs from the site
# server (never from a bench station), each reading accepted only after the
# device's self-reported MAC matched the router's ARP observation:
#
#   proven   model + firmware on 6 of 10: two radars (SR1000-I), two cameras
#            (SG-PTZ), the server and the operator station (both Dell)
#   proven   .1 is the subnet's DHCP server, DNS resolver and gateway, from
#            the leases held by two independent clients
#   proven   .10 and .29 hold DHCP LEASES, not statics
#   still    NOT the model of .1, .118, .132 or .133 — three distinct
#   NOT      reasons, spelled out at the foot of this file
#   still    NOT what is plugged into what, and NOT what powers what
#   NOT
#
# Two inferred shortlists were checked against hardware and BOTH were wrong:
# the radars were shortlisted AR-300/SR1000-F/SR500-F and read as SR1000-I;
# the cameras were shortlisted PC464A1 and read as SG-PTZ. Both shortlists
# were derived correctly from real archive data. `candidates:` is a
# shortlist, and a shortlist is not a model.
#
# None of these 8 MACs appears in bench-central, in either MAC spelling the
# archive uses. There is also no `kela-fob-03` site in it at all (it holds
# kela-fob-09-new, -11, -22..-26 and -backup). So this site was either never
# provisioned through the bench, provisioned before central shipping was
# switched on, or filed under another label. A miss is NOT evidence of
# anything: central shipping is opt-in per station (BENCH_CENTRAL_URL).
#
# `candidates:` below is a SHORTLIST, never a model. It comes from vendor
# correlation across the archive's 284 runs, which narrows the field without
# settling anything. Only the device's own API, or a bench record of it, can
# fill in `model:`.
version: 1
site: kela-fob-03
status: provisional
subnet: 192.168.88.0/24

# No `uplink:` — which device faces the CARRIER is still not established.
# What is established (2026-09-14, from the DHCP leases on .10 and .29) is
# that .1 is this subnet's default gateway, DHCP server and DNS resolver, so
# .1 is the LAN's way out. What sits beyond it is not: a Tailscale peer named
# otd-kela-fob-03 exists and did not answer on this subnet, so an OTD500
# probably sits upstream on the WAN side — but "probably" is not a topology,
# and `uplink:` stays empty until something reads it.

reservations:
  infra:
    range: 1-3
    owner: bench
  cameras:
    range: 30-50
    owner: bench
    dynamic: true
    # Worth noting: this site's Magos units are on .130-.133, so the
    # camera/radar overlap at .50 that the template trips on does not arise
    # here. The documented .50-.53 radar plan is not what this site uses.

nodes:
  router:
    kind: router
    vendor: Teltonika Networks
    mac: 20:97:27:36:55:ec
    addr: 192.168.88.1
    addr_source: static-manual
    evidence: arp
    critical: true
    roles: [dhcp-server, dns-resolver, default-gateway]
    candidates: ["RUTM08"]
    candidate_basis: >-
      hostname rut-kela-fob-03.lan, address .1, and RUTM08 being the only
      RUT-M model in 52 rutm runs (no RUTM51 anywhere in the archive)
    notes: >-
      Teltonika also makes the OTD500 and TSW202 on this same 20:97:27
