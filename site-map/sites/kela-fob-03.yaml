  radar_3:
    kind: radar
    vendor: Magosys Systems
    mac: 8c:1f:64:e7:48:c7
    addr: 192.168.88.132
    addr_source: static-bench
    evidence: arp
    critical: true
    candidates: ["SR1000-I"]
    candidate_basis: >-
      its two neighbours at .130 and .131 both read as SR1000-I off their own
      API, and all four share the Magosys OUI and were installed together —
      so this is the likeliest model, but it was NOT read off this unit
    notes: >-
      COULD NOT BE IDENTIFIED, and the reason matters. This unit answers
      ICMP (3/3, 0% loss) and sits in the site server's neighbour table, so
      it is powered and on the network — but it serves NO TCP port at all.
      Re-checked 2026-09-14 with a full connect scan of ports 1-10240 run
      FROM THE SITE SERVER, on the same L2 segment as the radar: zero open
      ports. The same scan from the same host finds 22, 80 and 443 open on
      .130 and .131. So this is not a vantage-point artifact and not the
      192.168.88.0/24 bench collision producing a false negative — it is the
      radar.

      That settles a specific question: a port forward cannot help here.
      Forwarding needs something listening to forward to, and these two
      units are not listening on anything. The Magos dashboard API is plain
      HTTP on 80, so there is nothing to query and no credential would
      change the outcome.

      Worth an operator's attention on its own merits: two of four radars
      serving no management port is either a stopped web service, a host
      firewall or VLAN difference on these two, a management interface bound
      to an address on another subnet, or a genuinely different product
      variant. Detections may still be flowing — that rides a separate path
      — so this is NOT evidence the radar is down. Deciding between those
      needs the TSW202's per-port view, or physical/console access.

      The router's view did narrow it. This MAC appears in the router's bridge
      FDB on lan3 (2026-09-14) exactly like every working device, so the unit
      is cabled and forwarding frames at layer 2. Cabling and power are
      therefore NOT the fault: it is up enough to answer ICMP and put frames
      on the wire, while serving nothing above that. Reads like a stopped
      service or a host firewall rather than a dead radar or a dead drop.
