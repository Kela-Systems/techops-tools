    firmware: 1.4.4
    mac: e8:cf:83:3f:f3:83
    addr: 192.168.88.29
    addr_source: dhcp-lease
    evidence:
      "*": arp
      vendor: device-api
      model: device-api
      firmware: device-api
    verified_at: 2026-09-14
    notes: >-
      Hostname kela-fob-03-operator. Identity read on the host itself
