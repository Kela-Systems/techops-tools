[project]
name = "bench-core"
version = "0.1.0"
description = "Shared bench-UI base + device clients for the side-by-side bench configurators (Magos radar/APU, Teltonika OTD500/RUTM08)"
# 3.11+ is recommended (and what the Windows bench installs). 3.10 is the hard
# floor because the pinned web stack (websockets 16) needs it; the launchers
# pick a 3.10+ interpreter so the stock macOS python3 (3.9) doesn't get used.
requires-python = ">=3.10"
dependencies = [
    "requests~=2.32",
    "paramiko~=4.0",
]

# The bench-UI base (bench_core.bench_ui) needs a web stack. CLI/library
# users don't, so it's an optional extra; the web apps install -e ".[ui]".
[project.optional-dependencies]
ui = [
    "fastapi~=0.128",
    "uvicorn~=0.39",
    "websockets~=16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench_core"]
