# Kela offline installer — config for the stick's real EFI System Partition.
#
# Some firmware only looks for \EFI\BOOT\BOOTX64.EFI on a partition typed as an
# ESP, so the bootloader is mirrored there. Ubuntu's grub then resolves its
# config as ($root)/boot/grub/grub.cfg — on the ESP that does not exist, which
# drops the operator at a grub rescue prompt. Hand control to the EFIBOOT
# partition, which holds the extracted ISO.

search --no-floppy --label EFIBOOT --set=kela_boot
if [ -z "${kela_boot}" ]; then
    echo "EFIBOOT partition not found on this stick — the ISO copy is missing."
    sleep 30
fi
set root=${kela_boot}
set prefix=(${kela_boot})/boot/grub
configfile (${kela_boot})/boot/grub/grub.cfg
