# >>> kela-offline-installer — managed block, regenerated on every build/update.
# Appended to the Ubuntu ISO's own grub.cfg; the ISO's original entries stay
# available as a manual-install fallback.

insmod read
insmod search_fs_file
insmod chain

menuentry "Install Ubuntu + Kela (UNATTENDED - WIPES SMALLEST DISK)" --id kela-auto {
    set gfxpayload=keep
    # `read` lives in grub's read module. If a signed grub without it is in
    # play the command errors, the variable stays empty, and the box installs
    # as kela-fob rather than hanging.
    set KELA_HOSTNAME=
    echo "Hostname for this box, then Enter (empty = kela-fob):"
    read KELA_HOSTNAME
    echo "Installing. This WIPES the smallest internal disk. Ctrl+Alt+Del now to abort."
    linux  /casper/vmlinuz kela.hostname=${KELA_HOSTNAME} modprobe.blacklist=nouveau autoinstall ---
    initrd /casper/initrd
}

menuentry "Boot the system already installed on this box" --id kela-boot-installed {
    search --no-floppy --file --set=kela_os /EFI/ubuntu/shimx64.efi
    if [ -n "${kela_os}" ]; then
        chainloader (${kela_os})/EFI/ubuntu/shimx64.efi
        boot
    fi
    echo "No installed Ubuntu found on this box — pick the install entry instead."
    sleep 10
}

# Re-imaging guard. A box that already carries an Ubuntu ESP boots that instead
# of being wiped again, which is what saves the day when the stick is left in
# and the firmware keeps USB ahead of the internal disk. To deliberately
# re-image such a box, pick the install entry from the menu.
search --no-floppy --file --set=kela_installed /EFI/ubuntu/shimx64.efi
if [ -n "${kela_installed}" ]; then
    set default=kela-boot-installed
    set timeout=10
else
    set default=kela-auto
    set timeout=8
fi
