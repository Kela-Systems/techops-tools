# Kela FOB bootable drive — GRUB config (UEFI)
# Loopback-boots the Ubuntu ISO stored unmodified on the data partition.

insmod part_gpt
insmod exfat
insmod ext2
insmod iso9660
insmod loopback
insmod search_label

set timeout=5
set default=0

# Find the data partition by filesystem label
search --no-floppy --label FOBDATA --set=dataroot

set isopath="/01-ubuntu-image/ubuntu-24.04.4-live-server-amd64.iso"

menuentry "Install Ubuntu 24.04 + Kela (UNATTENDED — WIPES INTERNAL DISK)" {
    loopback loop ($dataroot)$isopath
    linux (loop)/casper/vmlinuz iso-scan/filename=$isopath autoinstall ---
    initrd (loop)/casper/initrd
}

menuentry "Install Ubuntu 24.04 (manual, no autoinstall)" {
    loopback loop ($dataroot)$isopath
    linux (loop)/casper/vmlinuz iso-scan/filename=$isopath ---
    initrd (loop)/casper/initrd
}
