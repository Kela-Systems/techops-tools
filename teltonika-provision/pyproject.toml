[project]
name = "teltonika-provision"
version = "0.1.0"
description = "Shared Teltonika RutOS device client + bench-UI base for the OTD/RUTM configurators"
requires-python = ">=3.10"
dependencies = [
    "requests~=2.32",
    "paramiko~=4.0",
]

# The bench-UI base (teltonika_provision.bench_ui) needs a web stack. CLI/library
# users don't, so it's an optional extra; the web apps install -e ".[ui]".
[project.optional-dependencies]
ui = [
    "fastapi~=0.128",
    "uvicorn~=0.39",
    "websockets~=16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teltonika_provision"]
